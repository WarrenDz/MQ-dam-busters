<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dam Busters</title>
  <meta name="description" content="The story of the daring raid on Germany’s dams in May 1943, exploring 617 Squadron’s mission, its engineering, and its lasting impact.">
  <meta name="keywords" content="Dam Busters, WWII, World War II, Operation Chastise, history, story map, interactive map, ArcGIS">
  <meta name="author" content="Warren Davison">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://warrendz.github.io/dam-busters/">

  
  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#171717">

  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/scrollListener.js"></script>
</head>

<body>
  <!-- Simplified scene container: contains the scene layers and an optional foreground fill -->
  <div id="scene">
    <div id="scene-banner">
      <img src="./assets/Cover_1.png" class="scene-img" id="scene-layer1" alt="Background Layer">
      <img src="./assets/Cover_2.png" class="scene-img" id="scene-layer2" alt="Midground Layer">
      <img src="./assets/Cover_3.png" class="scene-img" id="scene-layer3" alt="Foreground Layer">
      <img src="./assets/Cover_4.png" class="scene-img" id="scene-layer4" alt="Top Layer">
      <div id="solid-fill" aria-hidden="true"></div>
    </div>

  </div>
  <!-- Embedded story -->
  <div class="storymaps-root"></div>
  <script type="module" src="./src/configStory.js"></script>

</body>

</html>
